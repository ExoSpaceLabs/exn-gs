name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scripts
        run: |
          bash -n scripts/build_simulation.sh
          bash -n scripts/quick_test.sh
          bash -n tests/hil_smoke.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libboost-system-dev

      - name: Seed stale CCSDSPack caches
        run: |
          mkdir -p build/ccsdspack_build-prefix/src/ccsdspack_build
          printf '%s\n' 'CMAKE_HOME_DIRECTORY:INTERNAL=/home/dev/Works/CCSDSPack' \
            > build/ccsdspack_build-prefix/src/ccsdspack_build/CMakeCache.txt

          mkdir -p build/_deps/ccsdspack-v2.0.0/build
          printf '%s\n' 'CMAKE_HOME_DIRECTORY:INTERNAL=/home/dev/Works/CCSDSPack' \
            > build/_deps/ccsdspack-v2.0.0/build/CMakeCache.txt

      - name: Build and test simulation stack
        run: ./scripts/build_simulation.sh --build-type Release
